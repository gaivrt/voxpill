[project]
name = "voxpill"
version = "1.2.1"
description = "Offline bilingual push-to-talk typing for Windows, macOS and Linux X11"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "pystray",
    "sherpa-onnx==1.13.4",
    "sherpa-onnx-core==1.13.4",
    "sounddevice",
    "webrtcvad-wheels==2.0.14",
    "pynput>=1.8.1,<2; sys_platform != 'win32'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pyinstaller>=6.0"]
