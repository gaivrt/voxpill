[project]
name = "voxpill"
version = "1.0.3"
description = "Offline bilingual push-to-talk typing for Windows"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "pystray",
    "sherpa-onnx==1.13.4",
    "sherpa-onnx-core==1.13.4",
    "sounddevice",
    "webrtcvad-wheels==2.0.14",
]

[dependency-groups]
dev = ["pyinstaller>=6.0"]
