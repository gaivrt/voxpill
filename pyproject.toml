[project]
name = "voxpill"
version = "0.2.0"
description = "Offline bilingual push-to-talk typing for Windows"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "pystray",
    "sherpa-onnx==1.13.4",
    "sherpa-onnx-core==1.13.4",
    "sounddevice",
]

[dependency-groups]
dev = ["pyinstaller>=6.0"]
qwen-asr = [
    "accelerate==1.14.0",
    "torch==2.12.0+cu130",
    "transformers==5.14.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
