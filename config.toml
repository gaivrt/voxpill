# VoxPill 配置 — 改完保存即可，下次启动生效。

[hotkey]
# 按住按键或组合键录音，松开其中任意一键后转写（push-to-talk）。
key = "ctrl_r"      # 默认右 Ctrl；可在托盘录入单键或组合键，例如 ctrl_l+shift_l+space

[overlay]
# auto 跟随 Windows 应用主题；也可强制 light 或 dark。
theme = "auto"

[behavior]
# 注入方式：paste = 剪贴板+Ctrl+V（微信等 IME 应用更稳，不会标点重复）；
#           unicode = 逐字符 SendInput（更通用，但个别应用会字符重复）
inject_method = "paste"
restore_clipboard = false  # false 最可靠：识别文本会留在剪贴板，避免异步粘贴读到旧内容
auto_enter = false  # 转写后是否自动回车发送（全局默认 false，只打字不发送）
min_seconds = 0.3   # 短于此时长的录音直接忽略

[recognition]
# Static Paraformer 在 CPU 上反复识别累积音频；预览按解码耗时在 1–2 秒间自适应。
preview_interval_seconds = 1.0
preview_max_interval_seconds = 2.0
preview_min_seconds = 0.8
preview_max_audio_seconds = 30.0
max_audio_seconds = 120.0  # 超过上限不保留完整 PCM，本轮忽略
# No-speech gate：20 ms 帧能量需持续高于录音自身底噪，避免静音时模型幻觉乱码。
activity_rms_floor = 50.0
activity_min_seconds = 0.12
activity_vad_mode = 2

[audio]
device = ""         # 麦克风设备名或编号；留空 = 系统默认输入设备
