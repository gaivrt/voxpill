name: Native builds and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 python3-tk xclip xvfb libxkbcommon-x11-0 fonts-noto-cjk
      - run: uv sync --frozen --python 3.12
      - name: Download release models
        run: uv run python bench/download_models.py --origin current_paraformer punctuation
      - name: Unit tests
        run: uv run python -m unittest discover -s bench/tests
      - name: Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UV_PROJECT_ENVIRONMENT: .venv
        run: ./scripts/build-release.ps1
      - name: macOS build
        if: runner.os == 'macOS'
        run: uv run python scripts/build_release.py
      - name: Linux build
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Windows'
        with:
          name: Overlay-check-${{ runner.os }}-${{ runner.arch }}
          path: build/overlay-smoke/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: VoxPill-${{ runner.os }}-${{ runner.arch }}
          path: dist/release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: VoxPill-*
          merge-multiple: true
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "VoxPill $GITHUB_REF_NAME — cross-platform subtitles" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --prerelease --verify-tag
